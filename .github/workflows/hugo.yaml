name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"] # 监听 main 分支的变动

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ------ Harness P0: Lint 作为强制执行层 ------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Run content linter
        run: bash scripts/lint.sh

  build:
    runs-on: ubuntu-latest
    needs: lint # 必须先通过 lint 才能构建
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true # 重要：下载主题子模块
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
