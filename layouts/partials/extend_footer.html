{{ if or .Params.mermaid .Site.Params.mermaid }}
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ 
        startOnLoad: true,
        theme: 'default' 
    });
</script>
{{ end }}

<div style="
    text-align: center;
    font-size: 12px;
    color: var(--secondary);
    margin-top: 10px;
    opacity: 0.8;">

    <!-- 引入脚本 -->
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

    <!-- 显示容器：用 span 组合，中间加个点分隔 -->
    <span id="busuanzi_container_site_pv">
        总访问 <span id="busuanzi_value_site_pv" style="font-weight: bold;"></span> 次
    </span>
    &nbsp;·&nbsp;
    <span id="busuanzi_container_site_uv">
        访客 <span id="busuanzi_value_site_uv" style="font-weight: bold;"></span> 人
    </span>
</div>

<!-- 文章页阅读量：等不蒜子数据加载后显示 -->
<script>
(function() {
    var el = document.getElementById('busuanzi_container_page_pv');
    if (!el) return;

    // 检查 busuanzi 数据是否已加载
    function checkBusuanzi() {
        var val = document.getElementById('busuanzi_value_page_pv');
        if (val && val.innerText && val.innerText !== '0' && val.innerText !== '') {
            el.style.display = 'inline';
            return true;
        }
        return false;
    }

    // 立即检查一次
    if (checkBusuanzi()) return;

    // 轮询检查
    var checkCount = 0;
    var check = setInterval(function() {
        checkCount++;
        if (checkBusuanzi()) {
            clearInterval(check);
        } else if (checkCount > 50) { // 10秒后停止检查
            clearInterval(check);
            // 如果一直没有数据，显示 0 views
            var val = document.getElementById('busuanzi_value_page_pv');
            if (val) {
                val.innerText = '0';
                el.style.display = 'inline';
            }
        }
    }, 200);

    // 监听 busuanzi 脚本加载完成事件
    if (window.busuanzi) {
        checkBusuanzi();
    } else {
        var script = document.querySelector('script[src*="busuanzi"]');
        if (script) {
            script.addEventListener('load', checkBusuanzi);
        }
    }
})();
</script>
